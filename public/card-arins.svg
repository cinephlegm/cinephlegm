<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="ARIN'S ADVENTURE">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2f1a"/>
      <stop offset=".48" stop-color="#a98b4c"/>
      <stop offset=".52" stop-color="#f2dfa2"/>
      <stop offset="1" stop-color="#3b2f1a"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#151109"/><stop offset="1" stop-color="#090806"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="994" height="104" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".6;1;.6" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <g opacity=".78"><path d="M76 76 C108 53 128 34 144 12 C145 38 139 57 124 72" fill="none" stroke="#9b7d42" stroke-width="2"/>
    <path d="M118 43 C101 34 91 24 84 12 C103 15 117 24 124 39 M139 29 C154 19 167 14 181 14 C172 29 159 38 144 40" fill="none" stroke="#b49a5c" stroke-width="1.8"/>
    <circle cx="144" cy="12" r="3" fill="#ead798"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(802 0) scale(-1 1)" opacity=".28"><path d="M76 76 C108 53 128 34 144 12 C145 38 139 57 124 72" fill="none" stroke="#9b7d42" stroke-width="2"/>
    <path d="M118 43 C101 34 91 24 84 12 C103 15 117 24 124 39 M139 29 C154 19 167 14 181 14 C172 29 159 38 144 40" fill="none" stroke="#b49a5c" stroke-width="1.8"/>
    <circle cx="144" cy="12" r="3" fill="#ead798"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle></g>
