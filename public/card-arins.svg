  <text x="500" y="70" text-anchor="middle" fill="#a99a72" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1">2D C++ ADVENTURE GAME BUILT WITH RAYLIB AND TILED,</text>
<text x="500" y="88" text-anchor="middle" fill="#a99a72" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1">WITH A PLAYABLE WINDOWS RELEASE.</text>
