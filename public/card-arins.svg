<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="ARIN'S ADVENTURE">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c301b"/><stop offset=".5" stop-color="#b08f4d"/><stop offset="1" stop-color="#3c301b"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#141108"/><stop offset="1" stop-color="#090806"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="994" height="90" rx="14" fill="url(#bg)" stroke="url(#b)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(76 13)" fill="none" stroke="#b39452" stroke-width="2">
      <path d="M20 72 L71 21 L88 7 L74 25 L24 76 Z"/>
      <path d="M38 57 L50 69 M27 68 L39 80"/>
      <path d="M62 29 C72 28 82 22 91 12" stroke="#806a3b"/>
      <circle cx="91" cy="12" r="3" fill="#e5d08d" stroke="none"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
    </g>
  <text x="560" y="36" text-anchor="middle" fill="#ecd99b" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="2.2" filter="url(#g)">
    ARIN'S ADVENTURE
