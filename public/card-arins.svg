  </text>
  <text x="560" y="63" text-anchor="middle" fill="#b9aa80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".65">2D C++ ADVENTURE GAME BUILT WITH RAYLIB AND TILED,</text>
<text x="560" y="80" text-anchor="middle" fill="#b9aa80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".65">WITH A PLAYABLE WINDOWS RELEASE.</text>
  <circle cx="950" cy="24" r="1.8" fill="#d8c17b"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
