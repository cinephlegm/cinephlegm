<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="128" viewBox="0 0 1000 128" role="img" aria-label="HALIGTREE">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2f1a"/>
      <stop offset=".48" stop-color="#a98b4c"/>
      <stop offset=".52" stop-color="#f2dfa2"/>
      <stop offset="1" stop-color="#3b2f1a"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#151109"/><stop offset="1" stop-color="#090806"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="994" height="122" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".6;1;.6" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <g opacity=".78"><path d="M90 78 C130 58 152 42 172 18 M130 56 C112 48 98 36 88 22 M145 45 C162 37 177 26 188 12" fill="none" stroke="#9b7d42" stroke-width="2"/>
    <circle cx="172" cy="18" r="3" fill="#ead798"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="22" r="2" fill="#c6a75e"><animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(802 0) scale(-1 1)" opacity=".28"><path d="M90 78 C130 58 152 42 172 18 M130 56 C112 48 98 36 88 22 M145 45 C162 37 177 26 188 12" fill="none" stroke="#9b7d42" stroke-width="2"/>
    <circle cx="172" cy="18" r="3" fill="#ead798"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="22" r="2" fill="#c6a75e"><animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/></circle></g>
  <text x="500" y="26" text-anchor="middle" fill="#776741" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2.4">ACTIVE PROJECT</text>
  <text x="500" y="51" text-anchor="middle" fill="#ead798" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="3" filter="url(#glow)">
    HALIGTREE
    <animate attributeName="fill" values="#c6aa62;#fff0b5;#c6aa62" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#a99a72" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1">A LONG-TERM LOCAL AI MODEL BUILT TO OPERATE ACROSS MY MACHINES,</text>
<text x="500" y="88" text-anchor="middle" fill="#a99a72" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1">MAINTAIN MEMORY AND CONTEXT, RESEARCH, CREATE AND USE TOOLS, CONTROL SOFTWARE AND DEVICES,</text>
<text x="500" y="106" text-anchor="middle" fill="#a99a72" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1">AND EVENTUALLY EXTEND INTO VISION, VOICE, SENSORS, AND ROBOTICS.</text>
  <g fill="#c9b06c" opacity=".4">
    <circle cx="248" cy="26" r="1.6"><animate attributeName="cy" values="26;18;26" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="748" cy="80" r="1.5"><animate attributeName="cy" values="80;70;80" dur="4.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>