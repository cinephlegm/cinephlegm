<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="HALIGTREE">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c301b"/><stop offset=".5" stop-color="#b08f4d"/><stop offset="1" stop-color="#3c301b"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#141108"/><stop offset="1" stop-color="#090806"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="994" height="90" rx="14" fill="url(#bg)" stroke="url(#b)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(70 14)" fill="none" stroke="#b39452" stroke-width="2">
      <path d="M20 68 C42 52 58 35 72 8 M46 45 C31 38 20 28 12 16 M58 31 C73 24 84 15 92 6"/>
      <circle cx="72" cy="8" r="3" fill="#e5d08d" stroke="none"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
  <text x="560" y="36" text-anchor="middle" fill="#ecd99b" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="2.2" filter="url(#g)">
    HALIGTREE
    <animate attributeName="fill" values="#c8ab63;#fff0b8;#c8ab63" dur="4.2s" repeatCount="indefinite"/>
  </text>
  <text x="560" y="63" text-anchor="middle" fill="#b9aa80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".65">A LONG-TERM LOCAL AI MODEL BUILT TO RUN ACROSS MY MACHINES, MAINTAIN MEMORY, RESEARCH, USE TOOLS,</text>
<text x="560" y="80" text-anchor="middle" fill="#b9aa80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".65">CONTROL SOFTWARE AND DEVICES, AND EVOLVE TOWARD VISION, VOICE, SENSORS, AND ROBOTICS.</text>
  <circle cx="950" cy="24" r="1.8" fill="#d8c17b"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
</svg>