<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="278" viewBox="0 0 1000 278" role="img" aria-label="ARSENAL">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3b2f1a"/><stop offset=".48" stop-color="#a98b4c"/><stop offset=".52" stop-color="#f2dfa2"/><stop offset="1" stop-color="#3b2f1a"/>
    <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#141108"/><stop offset="1" stop-color="#090806"/></linearGradient>
</defs>

<rect x="3" y="3" width="994" height="272" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2">
  <animate attributeName="stroke-opacity" values=".58;1;.58" dur="4s" repeatCount="indefinite"/>
</rect>

<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <text x="500" y="34" fill="#8d7a51" font-size="11" letter-spacing="2.5">LANGUAGES</text>
  <text x="500" y="57" fill="#e1cd92" font-size="15" letter-spacing="1.25">C++ · C# · RUST · PYTHON · JAVA · JAVASCRIPT · TYPESCRIPT
    <animate attributeName="fill" values="#cdb777;#f5e3aa;#cdb777" dur="5s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="91" fill="#8d7a51" font-size="11" letter-spacing="2.5">ENGINES / 3D</text>
  <text x="500" y="114" fill="#e1cd92" font-size="15" letter-spacing="1.25">UNITY · UNREAL ENGINE · BLENDER</text>

  <text x="500" y="148" fill="#8d7a51" font-size="11" letter-spacing="2.5">REVERSE ENGINEERING</text>
  <text x="500" y="171" fill="#f0dc9b" font-size="15" letter-spacing="1.1">GHIDRA · CHEAT ENGINE · X64DBG · RECLASS.NET · HXD
    <animate attributeName="opacity" values=".72;1;.72" dur="4.2s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="205" fill="#8d7a51" font-size="11" letter-spacing="2.5">AI / ROBOTICS</text>
  <text x="500" y="228" fill="#e1cd92" font-size="15" letter-spacing="1.25">ML-AGENTS · MEDIAPIPE</text>

  <text x="500" y="252" fill="#8d7a51" font-size="10" letter-spacing="2">EMULATION / BUILD / PLATFORM</text>
  <text x="500" y="270" fill="#b8a675" font-size="12.5" letter-spacing=".85">RPCS3 · DOLPHIN · CEMU · FMOD · CMAKE · GRADLE · GIT · GITHUB · VISUAL STUDIO · VS CODE · ANDROID STUDIO</text>
</g>

<g fill="#d8c17b" opacity=".55">
  <circle cx="43" cy="38" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="957" cy="238" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
</g>
</svg>