<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="ARSENAL">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3b2f1a"/><stop offset=".48" stop-color="#a98b4c"/><stop offset=".52" stop-color="#f2dfa2"/><stop offset="1" stop-color="#3b2f1a"/>
    <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#141108"/><stop offset="1" stop-color="#090806"/></linearGradient>
</defs>
<rect x="3" y="3" width="994" height="304" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2">
  <animate attributeName="stroke-opacity" values=".58;1;.58" dur="4s" repeatCount="indefinite"/>
</rect>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <text x="500" y="31" fill="#8d7a51" font-size="12" letter-spacing="2.4">LANGUAGES</text>
  <text x="500" y="54" fill="#e1cd92" font-size="15.5" letter-spacing="1.15">C++ · C# · RUST · PYTHON · JAVA · JAVASCRIPT · TYPESCRIPT</text>

  <text x="500" y="87" fill="#8d7a51" font-size="12" letter-spacing="2.4">ENGINES / 3D</text>
  <text x="500" y="110" fill="#e1cd92" font-size="15.5" letter-spacing="1.15">UNITY · UNREAL ENGINE · BLENDER</text>

  <text x="500" y="143" fill="#8d7a51" font-size="12" letter-spacing="2.4">REVERSE ENGINEERING</text>
  <text x="500" y="166" fill="#f0dc9b" font-size="15.5" letter-spacing="1">GHIDRA · CHEAT ENGINE · X64DBG · RECLASS.NET · HXD
    <animate attributeName="opacity" values=".72;1;.72" dur="4.2s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="199" fill="#8d7a51" font-size="12" letter-spacing="2.4">AI / ROBOTICS</text>
  <text x="500" y="222" fill="#e1cd92" font-size="15.5" letter-spacing="1.15">ML-AGENTS · MEDIAPIPE</text>

  <text x="500" y="255" fill="#8d7a51" font-size="12" letter-spacing="2.1">EMULATION / BUILD / PLATFORM</text>
  <text x="500" y="278" fill="#c5b47f" font-size="13.5" letter-spacing=".8">RPCS3 · DOLPHIN · CEMU · FMOD · CMAKE · GRADLE · GIT · GITHUB</text>
  <text x="500" y="297" fill="#a99a72" font-size="12.5" letter-spacing=".85">VISUAL STUDIO · VS CODE · ANDROID STUDIO</text>
</g>
<g fill="#d8c17b" opacity=".55">
  <circle cx="43" cy="38" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="957" cy="270" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
</g>
</svg>