<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="ML-AGENTS NAVIGATION VS NAVMESH">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c301b"/><stop offset=".5" stop-color="#b08f4d"/><stop offset="1" stop-color="#3c301b"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090806"/><stop offset=".5" stop-color="#141108"/><stop offset="1" stop-color="#090806"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="994" height="90" rx="14" fill="url(#bg)" stroke="url(#b)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(72 16)" fill="none" stroke="#b39452" stroke-width="2">
      <path d="M8 62 L38 37 L61 51 L92 19"/>
      <circle cx="8" cy="62" r="4" fill="#d8c17b" stroke="none"/>
      <circle cx="38" cy="37" r="4" fill="#d8c17b" stroke="none"/>
      <circle cx="61" cy="51" r="4" fill="#d8c17b" stroke="none"/>
      <circle cx="92" cy="19" r="4" fill="#e5d08d" stroke="none">
        <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  <text x="500" y="36" text-anchor="middle" fill="#ecd99b" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="2.2" filter="url(#g)">
    ML-AGENTS NAVIGATION VS NAVMESH
    <animate attributeName="fill" values="#c8ab63;#fff0b8;#c8ab63" dur="4.2s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="63" text-anchor="middle" fill="#b9aa80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".65">RAYCAST-BASED PPO NAVIGATION COMPARED AGAINST</text>
<text x="500" y="80" text-anchor="middle" fill="#b9aa80" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".65">A CONVENTIONAL UNITY NAVMESH BASELINE.</text>
  <circle cx="950" cy="24" r="1.8" fill="#d8c17b"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
</svg>