    <circle cx="116" cy="38" r="9" fill="none" stroke="#ead798"><animate attributeName="r" values="5;14;5" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="2.8s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(802 0) scale(-1 1)" opacity=".28"><g stroke="#9b7d42" stroke-width="1.6" fill="none"><path d="M76 66 L116 38 L162 58 L198 24"/><path d="M116 38 L148 18"/></g>
    <g fill="#e5cf8e"><circle cx="76" cy="66" r="4"/><circle cx="116" cy="38" r="4"/><circle cx="162" cy="58" r="4"/><circle cx="198" cy="24" r="4"/><circle cx="148" cy="18" r="3"/></g>
    <circle cx="116" cy="38" r="9" fill="none" stroke="#ead798"><animate attributeName="r" values="5;14;5" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="2.8s" repeatCount="indefinite"/></circle></g>
