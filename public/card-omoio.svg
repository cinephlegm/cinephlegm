<text x="500" y="88" text-anchor="middle" fill="#a99a72" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.1">LETTING REMOTE PLAYERS JOIN FROM PC OR PHONE AS THEIR OWN CONTROLLER / PLAYER.</text>
