<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="CINE — under unalloyed gold">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070705"/>
      <stop offset=".48" stop-color="#171108"/>
      <stop offset="1" stop-color="#070705"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f592f"/>
      <stop offset=".45" stop-color="#e7d394"/>
      <stop offset=".55" stop-color="#fff2bd"/>
      <stop offset="1" stop-color="#6f592f"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <path d="M600 270 C600 220 600 178 600 132" fill="none" stroke="#b99b56" stroke-width="3" opacity=".78"/>
  <path d="M600 205 C545 190 502 163 463 125 C420 83 367 67 304 61" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0" dur="2.5s" fill="freeze"/>
  </path>
  <path d="M600 205 C655 190 698 163 737 125 C780 83 833 67 896 61" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0" dur="2.5s" fill="freeze"/>
  </path>
  <path d="M545 180 C500 173 463 154 428 124 M655 180 C700 173 737 154 772 124 M517 160 C477 147 449 124 430 94 M683 160 C723 147 751 124 770 94" fill="none" stroke="#8c743e" stroke-width="2" opacity=".9"/>
  <path d="M463 125 C447 111 432 96 419 77 M737 125 C753 111 768 96 781 77 M401 81 C384 71 365 65 343 64 M799 81 C816 71 835 65 857 64" fill="none" stroke="#8c743e" stroke-width="2" opacity=".78"/>

  <g fill="#e7d394" opacity=".75">
    <circle cx="337" cy="63" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="419" cy="77" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="781" cy="77" r="2.5"><animate attributeName="opacity" values=".25;1;.25" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="863" cy="63" r="3"><animate attributeName="opacity" values="1;.25;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(600 103)" fill="none" stroke="url(#gold)" stroke-width="2.3" filter="url(#glow)">
    <path d="M0 -31 C-8 -16 -19 -10 -31 -4 C-16 -2 -8 5 0 18 C8 5 16 -2 31 -4 C19 -10 8 -16 0 -31Z"/>
    <path d="M0 -19 C-4 -10 -9 -5 -16 -2 C-8 0 -4 5 0 12 C4 5 8 0 16 -2 C9 -5 4 -10 0 -19Z" opacity=".65"/>
  </g>

  <text x="600" y="178" text-anchor="middle" fill="#f6efd8" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="18">CINE</text>
  <text x="600" y="211" text-anchor="middle" fill="#cdbb82" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5">GAMES  ·  SYSTEMS  ·  AI  ·  MODDING</text>
  <text x="600" y="244" text-anchor="middle" fill="#806d43" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3">UNDER UNALLOYED GOLD</text>

  <g fill="#d9c582" opacity=".52">
    <circle cx="190" cy="224" r="2"><animate attributeName="cy" values="224;205;224" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="218" r="2"><animate attributeName="cy" values="218;198;218" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="108" r="1.7"><animate attributeName="cy" values="108;92;108" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="115" r="1.7"><animate attributeName="cy" values="115;99;115" dur="4.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>