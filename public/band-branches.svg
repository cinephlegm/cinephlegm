<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="78" viewBox="0 0 1200 78" role="img" aria-label="THE HALIGTREE">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c3c21"/>
      <stop offset=".38" stop-color="#a98b4c"/>
      <stop offset=".5" stop-color="#f2dfa2"/>
      <stop offset=".62" stop-color="#a98b4c"/>
      <stop offset="1" stop-color="#4c3c21"/>
      <animate attributeName="x1" values="-1;1;-1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M24 39 H430 C474 39 508 30 540 15" fill="none" stroke="url(#g)" stroke-width="2">
    <animate attributeName="opacity" values=".6;1;.6" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <path d="M1176 39 H770 C726 39 692 30 660 15" fill="none" stroke="url(#g)" stroke-width="2">
    <animate attributeName="opacity" values="1;.6;1" dur="3.4s" repeatCount="indefinite"/>
  </path>

  <path d="M540 15 C555 25 568 32 584 39 M660 15 C645 25 632 32 616 39" fill="none" stroke="#8d743f" stroke-width="1.5"/>

  <g transform="translate(600 39)" fill="none" stroke="#e7d394" stroke-width="1.7" filter="url(#glow)">
    <path d="M0 -13 C-4 -6 -9 -3 -16 0 C-9 3 -4 6 0 13 C4 6 9 3 16 0 C9 -3 4 -6 0 -13Z">
      <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="35" text-anchor="middle" fill="#ead798" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3" filter="url(#glow)">
    THE HALIGTREE
    <animate attributeName="fill" values="#c7aa63;#fff0b8;#c7aa63" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="59" text-anchor="middle" fill="#817351" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">
    ACTIVE PRIVATE PROJECTS
    <animate attributeName="opacity" values=".55;.95;.55" dur="4.5s" repeatCount="indefinite"/>
  </text>
</svg>